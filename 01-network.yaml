AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Network infrastructure for ECS Fargate application.
  VPC 172.31.0.0/20 with 2 public and 2 private subnets.

Parameters:

  EnvironmentName:
    Type: String
    Default: dev
    Description: Environment name

  VpcCidr:
    Type: String
    Default: 172.31.0.0/20
    Description: VPC CIDR

Resources:

  # ============================================================
  # VPC
  # ============================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'


  # ============================================================
  # INTERNET GATEWAY
  # ============================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'


  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway


  # ============================================================
  # PUBLIC SUBNET 1
  # ============================================================

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 172.31.0.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      MapPublicIpOnLaunch: true

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-1'


  # ============================================================
  # PUBLIC SUBNET 2
  # ============================================================

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 172.31.1.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      MapPublicIpOnLaunch: true

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-2'


  # ============================================================
  # PRIVATE SUBNET 1
  # ============================================================

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 172.31.2.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-subnet-1'


  # ============================================================
  # PRIVATE SUBNET 2
  # ============================================================

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 172.31.3.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-subnet-2'


  # ============================================================
  # PUBLIC ROUTE TABLE
  # ============================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'


  PublicRoute:
    Type: AWS::EC2::Route

    DependsOn:
      - AttachInternetGateway

    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable


  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable


  # ============================================================
  # NAT GATEWAY
  # ============================================================

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachInternetGateway

    Properties:
      Domain: vpc

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-eip'


  NatGateway:
    Type: AWS::EC2::NatGateway

    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-gateway'


  # ============================================================
  # PRIVATE ROUTE TABLE
  # ============================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-rt'


  PrivateRoute:
    Type: AWS::EC2::Route

    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway


  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable


  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable


  # ============================================================
  # ALB SECURITY GROUP
  # ============================================================

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VPC

      SecurityGroupIngress:

        - Description: Allow HTTP from Internet
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: Allow Application from Internet
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:

        - Description: Allow outbound traffic
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb-sg'


  # ============================================================
  # ECS SECURITY GROUP
  # ============================================================

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: Security group for ECS Fargate tasks
      VpcId: !Ref VPC

      SecurityGroupIngress:

        - Description: Allow application traffic from ALB
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

      SecurityGroupEgress:

        - Description: Allow outbound traffic
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ecs-sg'


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  VPCId:
    Description: VPC ID
    Value: !Ref VPC

    Export:
      Name: !Sub '${AWS::StackName}-VPCId'


  PublicSubnet1:
    Description: Public subnet 1
    Value: !Ref PublicSubnet1

    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet1'


  PublicSubnet2:
    Description: Public subnet 2
    Value: !Ref PublicSubnet2

    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet2'


  PrivateSubnet1:
    Description: Private subnet 1
    Value: !Ref PrivateSubnet1

    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet1'


  PrivateSubnet2:
    Description: Private subnet 2
    Value: !Ref PrivateSubnet2

    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet2'


  ALBSecurityGroup:
    Description: ALB security group
    Value: !Ref ALBSecurityGroup

    Export:
      Name: !Sub '${AWS::StackName}-ALBSecurityGroup'


  ECSSecurityGroup:
    Description: ECS security group
    Value: !Ref ECSSecurityGroup

    Export:
      Name: !Sub '${AWS::StackName}-ECSSecurityGroup'


  NatGatewayId:
    Description: NAT Gateway ID
    Value: !Ref NatGateway